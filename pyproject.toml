[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajeval"
version = "0.1.0"
description = "Trajectory evaluation for LLM agents — grade what your agent did, not just what it said."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sachin Singh" }]
keywords = [
    "llm", "agents", "evaluation", "eval", "agent-evaluation",
    "trajectory", "tool-use", "llmops", "ai-agents", "testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/sachincse/trajeval"
Issues = "https://github.com/sachincse/trajeval/issues"

[tool.hatch.build.targets.wheel]
packages = ["trajeval"]
